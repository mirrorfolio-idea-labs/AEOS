[package]
name = "aeos-desktop"
version = "0.1.0"
description = "AEOS desktop shell — thin Tauri wrapper around the daemon-served ADE"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "aeos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-deep-link = "2.4"
tauri-plugin-single-instance = { version = "2.4", features = ["deep-link"] }
notify-rust = "4.18"
ureq = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = { version = "3.5", features = ["termination"] }

[profile.release]
strip = true
lto = true
