<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AEOS</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; height: 100vh; display: grid; place-items: center; background: #0b0d12; color: #c9d1e3; font: 14px system-ui, sans-serif; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #818cf8; display: inline-block; margin-right: 8px; animation: pulse 1s infinite alternate; }
      @keyframes pulse { from { opacity: .3 } to { opacity: 1 } }
    </style>
  </head>
  <body>
    <p><span class="dot"></span>Starting the AEOS daemon…</p>
  </body>
</html>
