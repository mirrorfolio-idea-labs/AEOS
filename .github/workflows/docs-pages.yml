name: docs-pages
# P5.M2.T1 + P5.M6.T1: publish the landing page (apps/site, at the root) and
# the docs site (built from docs/, under /docs/) to GitHub Pages on every push
# to main, and after every published release so the downloads stay current. One-time setup (maintainer): Settings → Pages → Source:
# "GitHub Actions".
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @aeos/docs build
      # P5.M6.T1: landing page at the root (real latest-release downloads),
      # docs under /docs/; every link, external ones included, must resolve
      - run: pnpm -F @aeos/site build
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - run: node apps/site/scripts/assemble-pages.mjs pages
      - run: pnpm -F @aeos/site exec playwright install --with-deps chromium
      - run: pnpm -F @aeos/site verify ../../pages --external
      - uses: actions/upload-pages-artifact@v3
        with: { path: pages }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
