name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm depcruise
      - name: schema drift check
        run: |
          pnpm -F @aeos/contracts gen:schemas
          git diff --exit-code packages/contracts/schemas
      - name: openapi drift check
        run: |
          pnpm -F @aeos/api gen:openapi
          git diff --exit-code packages/api/openapi.json
      - name: ADE Playwright suite
        run: |
          pnpm -F @aeos/ade exec playwright install --with-deps chromium
          pnpm -F @aeos/ade test
  # P2.M7 exit gate: conformance runs against the PINNED harness releases —
  # each pin is fetched, integrity-checked against DEFAULT_PINS, sealed,
  # re-verified and version-probed before the adapter suites run.
  pinned-harnesses:
    runs-on: ubuntu-latest
    env:
      AEOS_HOME: ${{ github.workspace }}/.aeos-ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: install + verify pinned harness binaries
        run: |
          node apps/cli/dist/main.js harness pins | while read -r ref _; do
            node apps/cli/dist/main.js harness install "$ref"
            bin=$(node apps/cli/dist/main.js harness verify "$ref" | sed 's/.*verified: //')
            "$bin" --version | grep -F "${ref#*@}"
          done
      - name: adapter conformance suites
        run: |
          pnpm -F @aeos/provider-claude test
          pnpm -F @aeos/provider-codex test
          pnpm -F @aeos/provider-opencode test
  # P4.M1 exit gate: build the container-tier runtime image and run the
  # container golden path + escape canary against IT (the main `ci` job runs
  # the same e2e against a stock node image).
  sandbox-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: build aeos-runner image (via the CLI, embedded Dockerfile)
        run: node apps/cli/dist/main.js sandbox build && node apps/cli/dist/main.js sandbox status
      - name: runner image carries the harness runtime
        run: docker run --rm aeos-runner:local sh -c 'node --version && git --version && rg --version | head -1'
      - name: container golden path + escape canary on aeos-runner
        env:
          AEOS_SANDBOX_E2E_IMAGE: aeos-runner:local
        run: pnpm -F @aeos/aeosd exec vitest run test/sandbox-container.e2e.test.ts
