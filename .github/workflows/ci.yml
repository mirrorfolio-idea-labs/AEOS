name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm depcruise
      - name: schema drift check
        run: |
          pnpm -F @aeos/contracts gen:schemas
          git diff --exit-code packages/contracts/schemas
      - name: openapi drift check
        run: |
          pnpm -F @aeos/api gen:openapi
          git diff --exit-code packages/api/openapi.json
      - name: ADE Playwright suite
        run: |
          pnpm -F @aeos/ade exec playwright install --with-deps chromium
          pnpm -F @aeos/ade test
