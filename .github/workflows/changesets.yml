name: changesets
# P5.M3.T1: every changeset merged into develop updates one "Version
# Packages" PR (version bumps + CHANGELOGs, all AEOS packages in lockstep).
# One-time repo setting: Settings → Actions → General → "Allow GitHub Actions
# to create and approve pull requests".
on:
  push:
    branches: [develop]
permissions:
  contents: write
  pull-requests: write
concurrency: changesets-${{ github.ref }}
jobs:
  version-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
