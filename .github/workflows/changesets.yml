name: changesets
# P5.M3.T1: every changeset merged into develop updates one "Version
# Packages" PR (version bumps + CHANGELOGs, all AEOS packages in lockstep).
# One-time repo setting: Settings → Actions → General → "Allow GitHub Actions
# to create and approve pull requests".
#
# Driven by the repo's own @changesets/cli (not changesets/action@v1, whose
# bundled reader predates the CLI's pre-release layout and crashes on
# .changeset/pre/ while an rc is in progress).
on:
  push:
    branches: [develop]
permissions:
  contents: write
  pull-requests: write
  actions: write     # dispatch CI on the version branch (below)
concurrency: changesets-${{ github.ref }}
jobs:
  version-pr:
    runs-on: ubuntu-latest
    env:
      BRANCH: changeset-release/${{ github.ref_name }}
      TITLE: 'chore(release): version packages'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: version packages
        id: version
        run: |
          pnpm changeset:version
          if [ -z "$(git status --porcelain)" ]; then
            echo "no pending changesets: nothing to version"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git status --short
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: push the version branch
        if: steps.version.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add -A
          git commit -q -m "$TITLE"
          git push --force origin "HEAD:$BRANCH"
      - name: open or update the Version Packages PR
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="Versions and changelogs from the pending changesets on \`${GITHUB_REF_NAME}\`. Merging this PR is how a release is cut (see \`.changeset/README.md\`)."
          if [ -n "$(gh pr list --head "$BRANCH" --base "$GITHUB_REF_NAME" --state open --json number --jq '.[].number')" ]; then
            echo "Version Packages PR already open; the force-push updated it"
          elif ! gh pr create --head "$BRANCH" --base "$GITHUB_REF_NAME" --title "$TITLE" --body "$body"; then
            # the one tolerated failure: the branch is pushed, only the PR call was refused
            echo "::warning title=Version PR not opened::$BRANCH is pushed with the version bump, but GitHub Actions may not create pull requests here. Enable Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests', or open $BRANCH → $GITHUB_REF_NAME by hand."
          fi
      - name: run CI on the version branch
        # a push made with GITHUB_TOKEN starts no workflows, so the version PR
        # would otherwise sit with no checks on its head; workflow_dispatch is
        # the one event that token may start, and its checks land on the same
        # commit the PR shows
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run desktop.yml --ref "$BRANCH"
